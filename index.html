<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Pastel Toss · Cozy Physics</title>
  <style>
    :root {
      --pink: #FFB5C2;
      --lavender: #C8B6FF;
      --mint: #B8E6C8;
      --peach: #FFD4A3;
      --sky: #B5D8FF;
      --cream: #FFF5E1;
      --lilac: #E0BBE4;
      --ink: #5B4B6B;
      --glass: rgba(255, 255, 255, 0.55);
      --glass-strong: rgba(255, 255, 255, 0.75);
      --shadow-soft: 0 10px 40px rgba(140, 110, 170, 0.18);
      --shadow-glow: 0 0 30px rgba(200, 182, 255, 0.35);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
      color: var(--ink);
      background: linear-gradient(160deg, #FFE5EC 0%, #E0BBE4 40%, #B5D8FF 100%);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    #app {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
      touch-action: none;
    }

    /* Safe area padding */
    .safe-top {
      padding-top: env(safe-area-inset-top);
    }

    .safe-bottom {
      padding-bottom: env(safe-area-inset-bottom);
    }

    .safe-left {
      padding-left: env(safe-area-inset-left);
    }

    .safe-right {
      padding-right: env(safe-area-inset-right);
    }

    /* Liquid glass UI */
    .ui-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    .ui-layer>* {
      pointer-events: auto;
    }

    .glass {
      background: var(--glass);
      backdrop-filter: blur(20px) saturate(1.4);
      -webkit-backdrop-filter: blur(20px) saturate(1.4);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: var(--shadow-soft), inset 0 1px 0 rgba(255, 255, 255, 0.8);
      border-radius: 28px;
    }

    /* Top bar */
    .top-bar {
      position: absolute;
      top: calc(16px + env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 10px 18px;
      animation: slideDown 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .score-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.5);
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 0.3px;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .score-pill.bump {
      transform: scale(1.12);
    }

    .score-pill .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--pink), var(--lavender));
      box-shadow: 0 0 10px var(--lavender);
    }

    /* Shape selector */
    .shape-tray {
      position: absolute;
      left: calc(16px + env(safe-area-inset-left));
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 14px;
      animation: slideRight 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .shape-btn {
      width: 56px;
      height: 56px;
      border-radius: 20px;
      border: none;
      background: rgba(255, 255, 255, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      cursor: pointer;
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      color: var(--ink);
    }

    .shape-btn:hover {
      transform: scale(1.08) rotate(-3deg);
    }

    .shape-btn:active {
      transform: scale(0.92);
    }

    .shape-btn.active {
      background: linear-gradient(135deg, var(--cream), var(--pink));
      box-shadow: 0 6px 20px rgba(255, 181, 194, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.9);
      transform: scale(1.05);
    }

    .shape-btn .label {
      position: absolute;
      left: 68px;
      background: var(--glass-strong);
      backdrop-filter: blur(10px);
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      opacity: 0;
      transform: translateX(-8px);
      transition: all 0.3s;
      pointer-events: none;
    }

    .shape-btn:hover .label {
      opacity: 1;
      transform: translateX(0);
    }

    /* Bottom controls */
    .bottom-bar {
      position: absolute;
      bottom: calc(20px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      padding: 12px;
      animation: slideUp 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .action-btn {
      padding: 12px 22px;
      border-radius: 22px;
      border: none;
      background: linear-gradient(135deg, #fff, #F5E8F5);
      color: var(--ink);
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 4px 16px rgba(140, 110, 170, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.9);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .action-btn:hover {
      transform: translateY(-2px) scale(1.03);
    }

    .action-btn:active {
      transform: translateY(1px) scale(0.97);
    }

    .action-btn.primary {
      background: linear-gradient(135deg, var(--pink), var(--lavender));
      color: white;
      box-shadow: 0 6px 24px rgba(200, 182, 255, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.4);
    }

    /* Power meter */
    .power-meter {
      position: absolute;
      right: calc(20px + env(safe-area-inset-right));
      top: 50%;
      transform: translateY(-50%);
      width: 14px;
      height: 200px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.4);
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .power-meter.visible {
      opacity: 1;
    }

    .power-fill {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 0%;
      background: linear-gradient(to top, var(--mint), var(--peach), var(--pink));
      border-radius: 10px;
      transition: height 0.08s linear;
      box-shadow: 0 0 20px rgba(255, 181, 194, 0.6);
    }

    /* Hint */
    .hint {
      position: absolute;
      bottom: calc(100px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 18px;
      border-radius: 18px;
      background: var(--glass-strong);
      backdrop-filter: blur(12px);
      font-size: 13px;
      font-weight: 500;
      opacity: 0.9;
      animation: pulse 3s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translate(-50%, -30px);
      }

      to {
        opacity: 1;
        transform: translate(-50%, 0);
      }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translate(-50%, 30px);
      }

      to {
        opacity: 1;
        transform: translate(-50%, 0);
      }
    }

    @keyframes slideRight {
      from {
        opacity: 0;
        transform: translate(-60%, -50%);
      }

      to {
        opacity: 1;
        transform: translate(0, -50%);
      }
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 0.75;
        transform: translateX(-50%) scale(1);
      }

      50% {
        opacity: 0.95;
        transform: translateX(-50%) scale(1.03);
      }
    }

    @media (max-width: 600px) {
      .shape-tray {
        flex-direction: row;
        top: auto;
        bottom: calc(100px + env(safe-area-inset-bottom));
        left: 50%;
        transform: translateX(-50%);
      }

      .shape-btn .label {
        display: none;
      }

      .power-meter {
        right: calc(12px + env(safe-area-inset-right));
        height: 160px;
      }
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <div class="ui-layer">
    <div class="top-bar glass safe-top">
      <div class="score-pill" id="scorePill">
        <span class="dot"></span>
        <span>Score</span>
        <span id="scoreValue">0</span>
      </div>
      <div class="score-pill" id="shotsPill">
        <span class="dot" style="background:linear-gradient(135deg,var(--mint),var(--sky));box-shadow:0 0 10px var(--mint)"></span>
        <span>Shots</span>
        <span id="shotsValue">0</span>
      </div>
    </div>

    <div class="shape-tray glass safe-left" id="shapeTray"></div>

    <div class="power-meter" id="powerMeter">
      <div class="power-fill" id="powerFill"></div>
    </div>

    <div class="hint" id="hint">Drag the ball back & release to toss ✨</div>

    <div class="bottom-bar glass safe-bottom">
      <button class="action-btn" id="resetBtn">🔄 New City</button>
      <button class="action-btn primary" id="tossBtn">🎯 Toss</button>
    </div>
  </div>

  <script type="importmap">
    {
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
  }
}
</script>

  <script type="module">
    import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import * as CANNON from 'cannon-es';

/* ============================================================
 *  SHAPES REGISTRY
 *  --------------------------------------------------------
 *  Each shape is a self-contained module. To add a new shape,
 *  just add a new entry here with: createMesh, createBody,
 *  defaultSize, and mass. Think of each entry as its own file
 *  in a "shapes/" folder.
 * ============================================================ */

const PASTEL = {
  pink:     0xFFB5C2,
  lavender: 0xC8B6FF,
  mint:     0xB8E6C8,
  peach:    0xFFD4A3,
  sky:      0xB5D8FF,
  cream:    0xFFF5E1,
  lilac:    0xE0BBE4,
  rose:     0xFFC9DE,
};
const PALETTE = Object.values(PASTEL);

// Shared physical material for all shapes (bouncy, cozy)
const physicsMaterial = new CANNON.Material('cozy');
const contactMat = new CANNON.ContactMaterial(physicsMaterial, physicsMaterial, {
  friction: 0.35,
  restitution: 0.42,
});

// Shared PBR material factory (shiny pastel with clearcoat)
function makeMat(color, opts = {}) {
  return new THREE.MeshPhysicalMaterial({
    color,
    roughness: opts.roughness ?? 0.28,
    metalness: opts.metalness ?? 0.02,
    clearcoat: opts.clearcoat ?? 0.7,
    clearcoatRoughness: 0.25,
    reflectivity: 0.6,
    envMapIntensity: 1.1,
    sheen: opts.sheen ?? 0.3,
    sheenColor: new THREE.Color(0xffffff),
    ...opts,
  });
}

/* ---------- shapes/roundedBox.js ---------- */
const RoundedBox = {
  id: 'roundedBox',
  name: 'Rounded Box',
  icon: '▢',
  defaultSize: { x: 1, y: 1, z: 1, radius: 0.18 },
  mass: 1.2,
  createMesh(size, color) {
    const geo = new RoundedBoxGeometry(size.x, size.y, size.z, 5, size.radius ?? 0.18);
    return new THREE.Mesh(geo, makeMat(color));
  },
  createBody(size, mass) {
    // Use sphere approximation for stable, rounded physics
    const r = Math.min(size.x, size.y, size.z) * 0.48;
    const body = new CANNON.Body({ mass, material: physicsMaterial, linearDamping: 0.08, angularDamping: 0.1 });
    body.addShape(new CANNON.Sphere(r));
    return body;
  },
};

/* ---------- shapes/capsule.js ---------- */
const Capsule = {
  id: 'capsule',
  name: 'Capsule',
  icon: '⬭',
  defaultSize: { radius: 0.45, height: 1.2 },
  mass: 1.0,
  createMesh(size, color) {
    const geo = new THREE.CapsuleGeometry(size.radius, size.height, 12, 20);
    return new THREE.Mesh(geo, makeMat(color));
  },
  createBody(size, mass) {
    const body = new CANNON.Body({ mass, material: physicsMaterial, linearDamping: 0.08, angularDamping: 0.12 });
    // Compound: cylinder + two spheres
    body.addShape(new CANNON.Cylinder(size.radius, size.radius, size.height, 12));
    body.addShape(new CANNON.Sphere(size.radius), new CANNON.Vec3(0, size.height/2, 0));
    body.addShape(new CANNON.Sphere(size.radius), new CANNON.Vec3(0, -size.height/2, 0));
    return body;
  },
};

/* ---------- shapes/sphere.js ---------- */
const Sphere = {
  id: 'sphere',
  name: 'Sphere',
  icon: '●',
  defaultSize: { radius: 0.55 },
  mass: 0.9,
  createMesh(size, color) {
    const geo = new THREE.SphereGeometry(size.radius, 32, 24);
    return new THREE.Mesh(geo, makeMat(color, { clearcoat: 1.0, roughness: 0.15 }));
  },
  createBody(size, mass) {
    const body = new CANNON.Body({ mass, material: physicsMaterial, linearDamping: 0.05, angularDamping: 0.08 });
    body.addShape(new CANNON.Sphere(size.radius));
    return body;
  },
};

/* ---------- shapes/cylinder.js ---------- */
const Cylinder = {
  id: 'cylinder',
  name: 'Drum',
  icon: '⬤',
  defaultSize: { radius: 0.5, height: 0.9 },
  mass: 1.3,
  createMesh(size, color) {
    const geo = new THREE.CylinderGeometry(size.radius, size.radius, size.height, 28, 1);
    return new THREE.Mesh(geo, makeMat(color));
  },
  createBody(size, mass) {
    const body = new CANNON.Body({ mass, material: physicsMaterial, linearDamping: 0.1, angularDamping: 0.15 });
    body.addShape(new CANNON.Cylinder(size.radius, size.radius, size.height, 16));
    return body;
  },
};

/* ---------- shapes/torus.js ---------- */
const Torus = {
  id: 'torus',
  name: 'Donut',
  icon: '◎',
  defaultSize: { radius: 0.55, tube: 0.22 },
  mass: 0.8,
  createMesh(size, color) {
    const geo = new THREE.TorusGeometry(size.radius, size.tube, 20, 40);
    return new THREE.Mesh(geo, makeMat(color, { clearcoat: 0.9 }));
  },
  createBody(size, mass) {
    // Approximate with a sphere for stable physics
    const r = size.radius * 0.75;
    const body = new CANNON.Body({ mass, material: physicsMaterial, linearDamping: 0.1, angularDamping: 0.15 });
    body.addShape(new CANNON.Sphere(r));
    return body;
  },
};

/* ---------- shapes/cone.js ---------- */
const Cone = {
  id: 'cone',
  name: 'Cone',
  icon: '▲',
  defaultSize: { radius: 0.5, height: 1.1 },
  mass: 1.0,
  createMesh(size, color) {
    // Rounded cone: use lathe for smooth rounded tip
    const pts = [];
    const segs = 16;
    for (let i = 0; i <= segs; i++) {
      const t = i / segs;
      const y = -size.height/2 + t * size.height;
      // Smooth rounded profile
      const r = size.radius * Math.cos(t * Math.PI * 0.5) * (1 - Math.pow(t, 3) * 0.3);
      pts.push(new THREE.Vector2(Math.max(0.02, r), y));
    }
    const geo = new THREE.LatheGeometry(pts, 28);
    return new THREE.Mesh(geo, makeMat(color));
  },
  createBody(size, mass) {
    const r = size.radius * 0.6;
    const body = new CANNON.Body({ mass, material: physicsMaterial, linearDamping: 0.1, angularDamping: 0.15 });
    body.addShape(new CANNON.Sphere(r));
    return body;
  },
};

/* ---------- shapes/pearl.js (glassy) ---------- */
const Pearl = {
  id: 'pearl',
  name: 'Pearl',
  icon: '◉',
  defaultSize: { radius: 0.5 },
  mass: 0.7,
  createMesh(size, color) {
    const geo = new THREE.SphereGeometry(size.radius, 32, 24);
    return new THREE.Mesh(geo, makeMat(color, {
      clearcoat: 1.0,
      clearcoatRoughness: 0.05,
      roughness: 0.08,
      transmission: 0.4,
      thickness: 0.8,
      ior: 1.4,
    }));
  },
  createBody(size, mass) {
    const body = new CANNON.Body({ mass, material: physicsMaterial, linearDamping: 0.05, angularDamping: 0.08 });
    body.addShape(new CANNON.Sphere(size.radius));
    return body;
  },
};

// The registry — add new shapes here
const SHAPES = {
  roundedBox: RoundedBox,
  capsule:    Capsule,
  sphere:     Sphere,
  cylinder:   Cylinder,
  torus:      Torus,
  cone:       Cone,
  pearl:      Pearl,
  cube:       Cube,
};
const SHAPE_LIST = Object.values(SHAPES);

/* ============================================================
 *  SCENE SETUP
 * ============================================================ */

const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xF5DCEE, 25, 70);

// Pastel gradient background
const bgCanvas = document.createElement('canvas');
bgCanvas.width = 512; bgCanvas.height = 512;
const bgCtx = bgCanvas.getContext('2d');
const grad = bgCtx.createLinearGradient(0, 0, 0, 512);
grad.addColorStop(0, '#FFE5EC');
grad.addColorStop(0.5, '#E0BBE4');
grad.addColorStop(1, '#B5D8FF');
bgCtx.fillStyle = grad;
bgCtx.fillRect(0, 0, 512, 512);
const bgTex = new THREE.CanvasTexture(bgCanvas);
scene.background = bgTex;

// Camera
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 8, 18);

// Controls
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 8;
controls.maxDistance = 40;
controls.maxPolarAngle = Math.PI * 0.48;
controls.minPolarAngle = Math.PI * 0.15;
controls.target.set(0, 2, 0);
controls.enablePan = false;
// Touch: one finger on empty = orbit, two finger = zoom
controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_ROTATE };

// Environment map (pastel reflections)
const pmrem = new THREE.PMREMGenerator(renderer);
const envScene = new THREE.Scene();
const envGeo = new THREE.SphereGeometry(20, 32, 32);
const envMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  uniforms: {},
  vertexShader: `varying vec3 vPos; void main(){ vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `varying vec3 vPos;
    void main(){
      vec3 n = normalize(vPos);
      vec3 top = vec3(1.0, 0.88, 0.93);
      vec3 mid = vec3(0.88, 0.78, 0.92);
      vec3 bot = vec3(0.72, 0.85, 0.98);
      vec3 c = mix(bot, mid, smoothstep(-1.0, 0.0, n.y));
      c = mix(c, top, smoothstep(0.0, 1.0, n.y));
      gl_FragColor = vec4(c, 1.0);
    }`,
});
envScene.add(new THREE.Mesh(envGeo, envMat));
const envMap = pmrem.fromScene(envScene, 0.04).texture;
scene.environment = envMap;
envGeo.dispose(); envMat.dispose(); pmrem.dispose();

// Lighting — cozy 3-point
const hemi = new THREE.HemisphereLight(0xFFE5EC, 0xB5D8FF, 0.7);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xFFF5E1, 1.4);
key.position.set(8, 14, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -18; key.shadow.camera.right = 18;
key.shadow.camera.top = 18; key.shadow.camera.bottom = -18;
key.shadow.camera.near = 0.5; key.shadow.camera.far = 50;
key.shadow.bias = -0.0005;
key.shadow.radius = 5;
scene.add(key);

const fill = new THREE.DirectionalLight(0xC8B6FF, 0.5);
fill.position.set(-8, 6, -4);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xFFB5C2, 0.6);
rim.position.set(0, 4, -10);
scene.add(rim);

/* ============================================================
 *  PHYSICS WORLD
 * ============================================================ */

const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -18, 0) });
world.broadphase = new CANNON.SAPBroadphase(world);
world.allowSleep = true;
world.solver.iterations = 10;
world.addContactMaterial(contactMat);

// Ground (visual + physics)
const groundGeo = new THREE.CircleGeometry(40, 64);
const groundMat = makeMat(0xFFF0F5, { roughness: 0.8, clearcoat: 0.2 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const groundBody = new CANNON.Body({ mass: 0, material: physicsMaterial });
groundBody.addShape(new CANNON.Plane());
groundBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
world.addBody(groundBody);

// Soft walls (invisible, keep things in play)
function addWall(x, z, rotY, width = 50) {
  const b = new CANNON.Body({ mass: 0, material: physicsMaterial });
  b.addShape(new CANNON.Plane());
  b.position.set(x, 0, z);
  b.quaternion.setFromEuler(0, rotY, 0);
  world.addBody(b);
}
addWall(0, -20, 0);
addWall(-20, 0, Math.PI/2);
addWall(20, 0, -Math.PI/2);

/* ============================================================
 *  BUILDING GENERATOR
 * ============================================================ */

const cityGroup = new THREE.Group();
scene.add(cityGroup);
const cityBodies = [];
const cityMeshes = [];

function rand(a, b) { return a + Math.random() * (b - a); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function spawnShape(shapeDef, position, scale = 1, color = null) {
  const size = { ...shapeDef.defaultSize };
  // Apply scale
  for (const k in size) if (typeof size[k] === 'number') size[k] *= scale;

  const c = color ?? pick(PALETTE);
  const mesh = shapeDef.createMesh(size, c);
  mesh.position.copy(position);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  cityGroup.add(mesh);

  const body = shapeDef.createBody(size, shapeDef.mass * scale);
  body.position.set(position.x, position.y, position.z);
  // Random gentle rotation
  body.quaternion.setFromEuler(rand(-0.1, 0.1), rand(0, Math.PI*2), rand(-0.1, 0.1));
  world.addBody(body);

  mesh.userData.body = body;
  body.userData.mesh = mesh;
  body.userData.shapeDef = shapeDef;
  body.userData.originalPos = position.clone();
  body.userData.scored = false;

  cityMeshes.push(mesh);
  cityBodies.push(body);
  return { mesh, body };
}

function generateCity() {
  // Clear existing
  for (const m of cityMeshes) { cityGroup.remove(m); m.geometry?.dispose(); }
  for (const b of cityBodies) world.removeBody(b);
  cityMeshes.length = 0;
  cityBodies.length = 0;

  // Generate clusters of towers
  const clusterCount = 5 + Math.floor(Math.random() * 3);
  const radius = 7;

  for (let c = 0; c < clusterCount; c++) {
    const angle = (c / clusterCount) * Math.PI * 2 + rand(-0.2, 0.2);
    const dist = rand(3, radius);
    const cx = Math.cos(angle) * dist;
    const cz = Math.sin(angle) * dist - 2;

    const towerHeight = Math.floor(rand(3, 7));
    let y = 0;

    for (let i = 0; i < towerHeight; i++) {
      const shape = pick(SHAPE_LIST);
      const scale = rand(0.7, 1.2) * (1 - i * 0.05);
      const offsetX = rand(-0.3, 0.3);
      const offsetZ = rand(-0.3, 0.3);
      const pos = new THREE.Vector3(cx + offsetX, y + 0.6, cz + offsetZ);
      spawnShape(shape, pos, scale);
      y += rand(0.9, 1.3);
    }
  }

  // A few scattered single shapes
  for (let i = 0; i < 8; i++) {
    const shape = pick(SHAPE_LIST);
    const angle = rand(0, Math.PI * 2);
    const dist = rand(2, 10);
    const pos = new THREE.Vector3(Math.cos(angle) * dist, 0.5, Math.sin(angle) * dist - 2);
    spawnShape(shape, pos, rand(0.6, 1.0));
  }
}

generateCity();

/* ============================================================
 *  PROJECTILE (the ball you throw)
 * ============================================================ */

const LAUNCH_POS = new THREE.Vector3(0, 1.2, 10);
const ballGeo = new THREE.SphereGeometry(0.45, 32, 24);
const ballMat = makeMat(0xFFC9DE, {
  clearcoat: 1.0,
  clearcoatRoughness: 0.05,
  roughness: 0.1,
  emissive: 0xFFB5C2,
  emissiveIntensity: 0.15,
});
const ballMesh = new THREE.Mesh(ballGeo, ballMat);
ballMesh.castShadow = true;
ballMesh.position.copy(LAUNCH_POS);
scene.add(ballMesh);

const ballBody = new CANNON.Body({
  mass: 2.2,
  material: physicsMaterial,
  linearDamping: 0.05,
  angularDamping: 0.1,
  collisionResponse: true,
});
ballBody.addShape(new CANNON.Sphere(0.45));
ballBody.position.set(LAUNCH_POS.x, LAUNCH_POS.y, LAUNCH_POS.z);
ballBody.type = CANNON.Body.KINEMATIC;
world.addBody(ballBody);

// Ball glow
const glowGeo = new THREE.SphereGeometry(0.6, 24, 16);
const glowMat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  uniforms: { uTime: { value: 0 }, uColor: { value: new THREE.Color(0xFFB5C2) } },
  vertexShader: `varying vec3 vN; void main(){ vN = normalize(normalMatrix * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `uniform vec3 uColor; uniform float uTime; varying vec3 vN;
    void main(){
      float rim = 1.0 - abs(dot(vN, vec3(0.0, 0.0, 1.0)));
      rim = pow(rim, 2.5);
      float pulse = 0.85 + 0.15 * sin(uTime * 2.0);
      gl_FragColor = vec4(uColor, rim * 0.6 * pulse);
    }`,
});
const ballGlow = new THREE.Mesh(glowGeo, glowMat);
ballMesh.add(ballGlow);

// Trajectory preview
const trajPoints = 40;
const trajGeo = new THREE.BufferGeometry();
const trajPos = new Float32Array(trajPoints * 3);
trajGeo.setAttribute('position', new THREE.BufferAttribute(trajPos, 3));
const trajMat = new THREE.LineDashedMaterial({
  color: 0xC8B6FF,
  dashSize: 0.2,
  gapSize: 0.15,
  transparent: true,
  opacity: 0.7,
});
const trajLine = new THREE.Line(trajGeo, trajMat);
trajLine.computeLineDistances();
trajLine.visible = false;
scene.add(trajLine);

/* ============================================================
 *  PARTICLES (impact puffs)
 * ============================================================ */

const particlePool = [];
const particleGeo = new THREE.SphereGeometry(0.08, 8, 6);

function spawnPuff(pos, color, count = 8) {
  for (let i = 0; i < count; i++) {
    const mat = makeMat(color, { roughness: 0.5, clearcoat: 0.5, transparent: true });
    const m = new THREE.Mesh(particleGeo, mat);
    m.position.copy(pos);
    const vel = new THREE.Vector3(rand(-1, 1), rand(0.5, 2), rand(-1, 1)).multiplyScalar(rand(0.5, 1.5));
    m.userData = { vel, life: 1.0, decay: rand(0.8, 1.5) };
    scene.add(m);
    particlePool.push(m);
  }
}

function updateParticles(dt) {
  for (let i = particlePool.length - 1; i >= 0; i--) {
    const p = particlePool[i];
    p.userData.life -= dt * p.userData.decay;
    if (p.userData.life <= 0) {
      scene.remove(p);
      p.material.dispose();
      particlePool.splice(i, 1);
      continue;
    }
    p.userData.vel.y -= 6 * dt;
    p.position.addScaledVector(p.userData.vel, dt);
    p.material.opacity = p.userData.life;
    p.scale.setScalar(p.userData.life);
  }
}

/* ============================================================
 *  THROW CONTROLS
 * ============================================================ */

let isAiming = false;
let aimStart = new THREE.Vector2();
let aimCurrent = new THREE.Vector2();
let throwPower = 0;
let throwDir = new THREE.Vector3();
const MAX_POWER = 22;

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

function getPointer(e) {
  const t = e.touches ? e.touches[0] : e;
  return { x: t.clientX, y: t.clientY };
}

function isOverUI(e) {
  const t = e.touches ? e.touches[0] : e;
  const el = document.elementFromPoint(t.clientX, t.clientY);
  return el && el.closest('.ui-layer');
}

function onPointerDown(e) {
  if (isOverUI(e)) return;
  const p = getPointer(e);
  pointer.x = (p.x / window.innerWidth) * 2 - 1;
  pointer.y = -(p.y / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObject(ballMesh, true);
  if (hits.length > 0) {
    isAiming = true;
    aimStart.set(p.x, p.y);
    aimCurrent.set(p.x, p.y);
    controls.enabled = false;
    document.getElementById('powerMeter').classList.add('visible');
    document.getElementById('hint').style.display = 'none';
    e.preventDefault();
  }
}

function onPointerMove(e) {
  if (!isAiming) return;
  const p = getPointer(e);
  aimCurrent.set(p.x, p.y);
  const dx = aimStart.x - aimCurrent.x;
  const dy = aimStart.y - aimCurrent.y;
  const dist = Math.sqrt(dx*dx + dy*dy);
  throwPower = Math.min(dist / 200, 1) * MAX_POWER;
  document.getElementById('powerFill').style.height = (throwPower / MAX_POWER * 100) + '%';

  // Direction: opposite of drag, projected into world
  const camRight = new THREE.Vector3();
  const camUp = new THREE.Vector3();
  camera.getWorldDirection(new THREE.Vector3());
  camRight.setFromMatrixColumn(camera.matrixWorld, 0).normalize();
  camUp.setFromMatrixColumn(camera.matrixWorld, 1).normalize();

  throwDir.set(0, 0, 0)
    .addScaledVector(camRight, dx / 200)
    .addScaledVector(camUp, -dy / 200)
    .normalize();
  // Bias forward (toward city)
  throwDir.z = -Math.abs(throwDir.z) - 0.5;
  throwDir.y = Math.max(throwDir.y, 0.2);
  throwDir.normalize();

  updateTrajectoryPreview();
  e.preventDefault();
}

function onPointerUp(e) {
  if (!isAiming) return;
  isAiming = false;
  controls.enabled = true;
  document.getElementById('powerMeter').classList.remove('visible');
  if (throwPower > 1) {
    launchBall();
  }
  throwPower = 0;
  trajLine.visible = false;
}

function updateTrajectoryPreview() {
  if (throwPower < 1) { trajLine.visible = false; return; }
  trajLine.visible = true;
  const vel = throwDir.clone().multiplyScalar(throwPower);
  const pos = LAUNCH_POS.clone();
  const v = vel.clone();
  const dt = 0.05;
  const attr = trajGeo.attributes.position;
  for (let i = 0; i < trajPoints; i++) {
    attr.setXYZ(i, pos.x, pos.y, pos.z);
    v.y -= 18 * dt;
    pos.addScaledVector(v, dt);
    if (pos.y < 0) break;
  }
  attr.needsUpdate = true;
  trajLine.computeLineDistances();
}

let resetTimeout = null;

function launchBall() {
  if (resetTimeout) clearTimeout(resetTimeout);
  const def = SHAPES[currentShapeId];
  const vel = throwDir.clone().multiplyScalar(throwPower);
  ballBody.mass = def ? def.mass : 2.2;
  ballBody.type = CANNON.Body.DYNAMIC;
  ballBody.updateMassProperties();
  ballBody.velocity.set(vel.x, vel.y, vel.z);
  ballBody.angularVelocity.set(rand(-5, 5), rand(-5, 5), rand(-5, 5));
  ballBody.wakeUp();
  shots++;
  updateUI();

  // Reset after flight
  resetTimeout = setTimeout(resetBall, 4500);
}

function resetBall() {
  if (resetTimeout) {
    clearTimeout(resetTimeout);
    resetTimeout = null;
  }
  ballBody.type = CANNON.Body.KINEMATIC;
  ballBody.velocity.set(0, 0, 0);
  ballBody.angularVelocity.set(0, 0, 0);
  ballBody.position.set(LAUNCH_POS.x, LAUNCH_POS.y, LAUNCH_POS.z);
  ballBody.quaternion.set(0, 0, 0, 1);
}

renderer.domElement.addEventListener('pointerdown', onPointerDown);
renderer.domElement.addEventListener('pointermove', onPointerMove);
renderer.domElement.addEventListener('pointerup', onPointerUp);
renderer.domElement.addEventListener('pointercancel', onPointerUp);

/* ============================================================
 *  UI
 * ============================================================ */

let currentShapeId = 'roundedBox';
let score = 0;
let shots = 0;

const tray = document.getElementById('shapeTray');
SHAPE_LIST.forEach((s, i) => {
  const btn = document.createElement('button');
  btn.className = 'shape-btn' + (i === 0 ? ' active' : '');
  btn.dataset.id = s.id;
  btn.innerHTML = `${s.icon}<span class="label">${s.name}</span>`;
  btn.addEventListener('click', () => {
    currentShapeId = s.id;
    document.querySelectorAll('.shape-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    updateBallAppearance();
  });
  tray.appendChild(btn);
});

function updateBallAppearance() {
  const def = SHAPES[currentShapeId];
  const size = { ...def.defaultSize };
  // Normalize so ball fits in ~0.45 radius
  const maxDim = Math.max(size.x || size.radius * 2 || 1, size.y || size.radius * 2 || 1, size.z || size.radius * 2 || 1);
  const scale = 0.9 / maxDim;
  for (const k in size) if (typeof size[k] === 'number') size[k] *= scale;

  const newGeo = def.createMesh(size, 0xFFC9DE).geometry;
  ballMesh.geometry.dispose();
  ballMesh.geometry = newGeo;

  // Replace physics shape
  while (ballBody.shapes.length) {
    ballBody.removeShape(ballBody.shapes[0]);
  }
  const tmp = def.createBody(size, def.mass);
  tmp.shapes.forEach((sh, i) => {
    ballBody.addShape(sh, tmp.shapeOffsets[i], tmp.shapeOrientations[i]);
  });
  ballBody.mass = def.mass;
  ballBody.updateMassProperties();
}

document.getElementById('resetBtn').addEventListener('click', () => {
  generateCity();
  resetBall();
  score = 0;
  shots = 0;
  updateUI();
});

document.getElementById('tossBtn').addEventListener('click', () => {
  // Quick toss with random-ish direction
  resetBall();
  const dir = new THREE.Vector3(rand(-0.3, 0.3), rand(0.4, 0.7), -1).normalize();
  throwDir.copy(dir);
  throwPower = MAX_POWER * 0.75;
  launchBall();
});

function updateUI() {
  document.getElementById('scoreValue').textContent = score;
  document.getElementById('shotsValue').textContent = shots;
  const pill = document.getElementById('scorePill');
  pill.classList.add('bump');
  setTimeout(() => pill.classList.remove('bump'), 300);
}

/* ============================================================
 *  SCORING
 * ============================================================ */

function checkScore() {
  for (const b of cityBodies) {
    if (b.userData.scored) continue;
    const orig = b.userData.originalPos;
    const dx = b.position.x - orig.x;
    const dy = b.position.y - orig.y;
    const dz = b.position.z - orig.z;
    const dist2 = dx*dx + dy*dy + dz*dz;
    const speed2 = b.velocity.x*b.velocity.x + b.velocity.y*b.velocity.y + b.velocity.z*b.velocity.z;
    if (dist2 > 1.5 || speed2 > 4) {
      b.userData.scored = true;
      score++;
      updateUI();
      // Puff
      const c = b.userData.mesh.material.color.getHex();
      spawnPuff(new THREE.Vector3(b.position.x, b.position.y, b.position.z), c, 6);
    }
  }
}

/* ============================================================
 *  MAIN LOOP
 * ============================================================ */

const clock = new THREE.Clock();
const fixedDt = 1 / 60;
let acc = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  acc += dt;

  // Fixed-step physics
  while (acc >= fixedDt) {
    world.step(fixedDt);
    acc -= fixedDt;
  }

  // Sync meshes
  for (const b of cityBodies) {
    const m = b.userData.mesh;
    m.position.copy(b.position);
    m.quaternion.copy(b.quaternion);
  }
  ballMesh.position.copy(ballBody.position);
  ballMesh.quaternion.copy(ballBody.quaternion);

  // Ball glow pulse
  glowMat.uniforms.uTime.value = clock.elapsedTime;

  // Particles
  updateParticles(dt);

  // Score check (throttled)
  if (ballBody.type === CANNON.Body.DYNAMIC) checkScore();

  controls.update();
  renderer.render(scene, camera);
}
animate();

/* ============================================================
 *  RESIZE
 * ============================================================ */

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => setTimeout(onResize, 200));

// Prevent iOS bounce
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('touchmove', e => {
  if (e.touches.length > 1) e.preventDefault();
}, { passive: false });

  </script>
