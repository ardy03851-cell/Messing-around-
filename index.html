<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Qwen Dev Studio</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lucide-static/0.344.0/lucide.min.css">
  <style>
    :root {
      --bg-color: #09090b;
      --glass-bg: rgba(24, 24, 27, 0.6);
      --glass-border: rgba(63, 63, 70, 0.4);
      --glass-highlight: rgba(255, 255, 255, 0.05);
      --text-main: #fafafa;
      --text-muted: #a1a1aa;
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.4);
      --safe-top: env(safe-area-inset-top);
      --safe-bottom: env(safe-area-inset-bottom);
      --transition-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --transition-smooth: cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
    }

    body {
      margin: 0;
      background-color: var(--bg-color);
      color: var(--text-main);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
      /* Subtle WebGL-style background gradient */
      background-image: radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.15) 0%, transparent 50%);
    }

    /* Glassmorphism Base */
    .glass {
      background: var(--glass-bg);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid var(--glass-border);
      box-shadow:
        0 4px 30px rgba(0, 0, 0, 0.1),
        inset 0 1px 0 var(--glass-highlight);
    }

    /* Layout */
    header {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 100;
      border-bottom: 1px solid var(--glass-border);
      background: rgba(9, 9, 11, 0.8);
      backdrop-filter: blur(12px);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 600;
      font-size: 18px;
      letter-spacing: -0.02em;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--accent), #a855f7);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px var(--accent-glow);
    }

    main {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    /* Chat & Code Split View */
    .workspace {
      flex: 1;
      display: flex;
      transition: all 0.5s var(--transition-smooth);
    }

    .chat-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--glass-border);
      min-width: 0;
    }

    .code-panel {
      width: 0;
      opacity: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all 0.5s var(--transition-spring);
      background: #0d0d10;
    }

    .code-panel.active {
      width: 50%;
      opacity: 1;
      border-left: 1px solid var(--glass-border);
    }

    @media (max-width: 768px) {
      .workspace {
        flex-direction: column;
      }

      .chat-panel {
        border-right: none;
        border-bottom: 1px solid var(--glass-border);
      }

      .code-panel.active {
        width: 100%;
        height: 50%;
        border-left: none;
        border-top: 1px solid var(--glass-border);
      }
    }

    /* Messages */
    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      scroll-behavior: smooth;
    }

    .message {
      display: flex;
      gap: 16px;
      max-width: 85%;
      animation: slideUp 0.4s var(--transition-spring) forwards;
      opacity: 0;
      transform: translateY(10px);
    }

    .message.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .message.ai {
      align-self: flex-start;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .bubble {
      padding: 16px 20px;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.6;
      color: var(--text-main);
    }

    .message.user .bubble {
      background: var(--accent);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message.ai .bubble {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-bottom-left-radius: 4px;
    }

    /* Input Area */
    .input-area {
      padding: 24px;
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }

    .input-wrapper {
      flex: 1;
      position: relative;
    }

    textarea {
      width: 100%;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 16px 56px 16px 20px;
      color: var(--text-main);
      font-size: 15px;
      resize: none;
      outline: none;
      max-height: 200px;
      transition: border-color 0.2s;
    }

    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }

    .action-btn {
      position: absolute;
      right: 12px;
      bottom: 12px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s var(--transition-spring);
    }

    .action-btn:active {
      transform: scale(0.9);
    }

    .file-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .file-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.1);
    }

    /* Model Selector Bar */
    .model-bar {
      height: 56px;
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 12px;
      border-bottom: 1px solid var(--glass-border);
      overflow-x: auto;
      scrollbar-width: none;
    }

    .model-bar::-webkit-scrollbar {
      display: none;
    }

    .model-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 99px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .model-chip.active {
      background: rgba(99, 102, 241, 0.15);
      border-color: var(--accent);
      color: var(--accent);
    }

    .model-chip img {
      width: 16px;
      height: 16px;
      border-radius: 50%;
    }

    /* Settings Panel */
    .settings-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .settings-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .settings-panel {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 400px;
      max-width: 100%;
      background: var(--bg-color);
      border-left: 1px solid var(--glass-border);
      transform: translateX(100%);
      transition: transform 0.5s var(--transition-spring);
      display: flex;
      flex-direction: column;
      z-index: 201;
    }

    .settings-panel.active {
      transform: translateX(0);
    }

    .settings-header {
      padding: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--glass-border);
    }

    .settings-content {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .setting-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .setting-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }

    .input-field {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      padding: 12px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
    }

    .input-field:focus {
      border-color: var(--accent);
    }

    .btn-primary {
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.2s var(--transition-spring), box-shadow 0.2s;
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-primary:hover {
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      border: 1px solid var(--glass-border);
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: 500;
      cursor: pointer;
    }

    /* Animations */
    @keyframes slideUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--glass-border);
      border-radius: 3px;
    }
  </style>
</head>

<body>

  <header class="glass">
    <div class="logo">
      <div class="logo-icon"><i data-lucide="sparkles" style="width:18px;height:18px;color:white"></i></div>
      <span>Qwen Studio</span>
    </div>
    <div style="display:flex;gap:16px;">
      <button id="toggle-code" class="file-btn" title="Toggle Code Workspace"><i data-lucide="code-2" style="width:20px;height:20px"></i></button>
      <button id="open-settings" class="file-btn" title="Settings"><i data-lucide="settings" style="width:20px;height:20px"></i></button>
    </div>
  </header>

  <main>
    <div class="workspace">
      <!-- Chat Interface -->
      <div class="chat-panel">
        <div class="model-bar" id="model-bar">
          <!-- Models injected here -->
        </div>
        <div class="messages-container" id="messages">
          <!-- Messages injected here -->
        </div>
        <div class="input-area">
          <input type="file" id="file-input" multiple style="display:none">
          <button class="file-btn" onclick="document.getElementById('file-input').click()"><i data-lucide="paperclip" style="width:20px;height:20px"></i></button>
          <div class="input-wrapper">
            <textarea id="user-input" rows="1" placeholder="Message Qwen Studio..."></textarea>
            <button class="action-btn" id="send-btn"><i data-lucide="arrow-up" style="width:18px;height:18px"></i></button>
          </div>
        </div>
      </div>

      <!-- Code Interface -->
      <div class="code-panel" id="code-panel">
        <div
          style="padding:12px 24px;border-bottom:1px solid var(--glass-border);display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,0.02)">
          <span style="font-size:13px;font-weight:600;color:var(--text-muted)">WORKSPACE</span>
          <select id="file-selector" style="background:transparent;border:none;color:var(--text-main);font-size:13px;outline:none"></select>
        </div>
        <div id="monaco-container" style="flex:1;overflow:hidden"></div>
      </div>
    </div>
  </main>

  <!-- Settings Overlay -->
  <div class="settings-overlay" id="settings-overlay">
    <div class="settings-panel" id="settings-panel">
      <div class="settings-header">
        <h2 style="margin:0;font-size:18px;font-weight:600">Settings</h2>
        <button class="file-btn" id="close-settings" style="width:32px;height:32px"><i data-lucide="x" style="width:16px;height:16px"></i></button>
      </div>
      <div class="settings-content">

        <div class="setting-group">
          <div class="setting-title">Data Management</div>
          <p style="font-size:13px;color:var(--text-muted);margin:0">Load models from your external
            <code>models.json</code> file.</p>
          <input type="file" id="json-upload" accept=".json" style="display:none">
          <button class="btn-secondary" onclick="document.getElementById('json-upload').click()">Sync from File</button>
        </div>

        <div class="setting-group">
          <div class="setting-title">Add New Model Manually</div>
          <select id="add-provider" class="input-field"></select>
          <input type="text" id="add-name" class="input-field" placeholder="Model Display Name (e.g. GPT-4o)">
          <input type="text" id="add-model-id" class="input-field" placeholder="Exact Model ID (e.g. gpt-4o-2024-05-13)">
          <input type="text" id="add-endpoint" class="input-field" placeholder="API Endpoint URL">
          <input type="password" id="add-key" class="input-field" placeholder="API Key">
          <button class="btn-primary" id="add-model-btn">Add Model</button>
        </div>

        <div class="setting-group">
          <div class="setting-title">Appearance</div>
          <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0">
            <span style="font-size:14px">High Contrast Mode</span>
            <input type="checkbox">
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0">
            <span style="font-size:14px">Reduce Motion</span>
            <input type="checkbox">
          </div>
        </div>

        <div class="setting-group">
          <div class="setting-title">System Prompt</div>
          <textarea class="input-field" rows="4" placeholder="You are a helpful coding assistant..."></textarea>
        </div>

      </div>
    </div>
  </div>

  <!-- Dependencies -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>

  <script>
    // State Management
        let state = {
            providers: [],
            models: [],
            activeModelId: null,
            files: { 'main.js': '// Start coding here\n' },
            activeFile: 'main.js',
            messages: []
        };

        // Initialize App
        document.addEventListener('DOMContentLoaded', async () => {
            lucide.createIcons();
            initMonaco();
            setupEventListeners();
            
            // Attempt to load local models.json automatically
            try {
                const response = await fetch('./models.json');
                if(response.ok) {
                    const data = await response.json();
                    loadData(data);
                } else {
                    loadFallback();
                }
            } catch (e) {
                console.warn("Could not fetch models.json automatically. Use Sync from File in settings.");
                loadFallback();
            }
        });

        function loadFallback() {
            // Minimal fallback if file isn't served via HTTP properly
            loadData({
                providers: [{id:"anyai",name:"AnyAI",icon:"https://api.dicebear.com/7.x/shapes/svg?seed=anyai"}],
                models: [{id:"deepseek-v4-flash",name:"DeepSeek V4 Flash",providerId:"anyai",apiEndpoint:"https://api.anyai.ai/v1/chat/completions",apiKey:"sk-GwXuS2_d1UIVFE8Qz6AK_w",modelName:"deepseek/deepseek-v4-flash"}]
            });
        }

        function loadData(data) {
            state.providers = data.providers;
            state.models = data.models;
            state.activeModelId = state.models[0]?.id || null;
            renderModels();
            renderProviderSelect();
        }

        // UI Rendering
        function renderModels() {
            const bar = document.getElementById('model-bar');
            bar.innerHTML = '';
            state.models.forEach(model => {
                const provider = state.providers.find(p => p.id === model.providerId);
                const chip = document.createElement('div');
                chip.className = `model-chip ${model.id === state.activeModelId ? 'active' : ''}`;
                chip.onclick = () => { state.activeModelId = model.id; renderModels(); };
                chip.innerHTML = `
                    <img src="${provider?.icon || ''}" alt="${provider?.name}">
                    <span>${model.name}</span>
                `;
                bar.appendChild(chip);
            });
        }

        function renderProviderSelect() {
            const select = document.getElementById('add-provider');
            select.innerHTML = state.providers.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
        }

        // Event Listeners
        function setupEventListeners() {
            // Settings Toggle
            document.getElementById('open-settings').onclick = () => {
                document.getElementById('settings-overlay').classList.add('active');
                document.getElementById('settings-panel').classList.add('active');
            };
            document.getElementById('close-settings').onclick = () => {
                document.getElementById('settings-overlay').classList.remove('active');
                document.getElementById('settings-panel').classList.remove('active');
            };

            // Code Panel Toggle
            document.getElementById('toggle-code').onclick = () => {
                document.getElementById('code-panel').classList.toggle('active');
                setTimeout(() => window.dispatchEvent(new Event('resize')), 500); // Resize monaco
            };

            // Auto-resize textarea
            const input = document.getElementById('user-input');
            input.addEventListener('input', () => {
                input.style.height = 'auto';
                input.style.height = Math.min(input.scrollHeight, 200) + 'px';
            });

            // Send Message
            document.getElementById('send-btn').onclick = sendMessage;
            input.addEventListener('keydown', (e) => {
                if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
            });

            // Add Model Button
            document.getElementById('add-model-btn').onclick = () => {
                const newModel = {
                    id: crypto.randomUUID(),
                    name: document.getElementById('add-name').value,
                    providerId: document.getElementById('add-provider').value,
                    modelName: document.getElementById('add-model-id').value,
                    apiEndpoint: document.getElementById('add-endpoint').value,
                    apiKey: document.getElementById('add-key').value
                };
                if(!newModel.name || !newModel.modelName) return alert("Fill required fields");
                state.models.push(newModel);
                state.activeModelId = newModel.id;
                renderModels();
                // Clear inputs
                ['add-name','add-model-id','add-endpoint','add-key'].forEach(id => document.getElementById(id).value = '');
            };

            // File Upload for Sync
            document.getElementById('json-upload').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if(!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const data = JSON.parse(ev.target.result);
                        loadData(data);
                        alert("Models synced successfully!");
                    } catch(err) { alert("Invalid JSON file"); }
                };
                reader.readAsText(file);
            });

            // File Attachment Simulation
            document.getElementById('file-input').addEventListener('change', (e) => {
                const files = Array.from(e.target.files);
                files.forEach(f => {
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        state.files[f.name] = ev.target.result;
                        updateFileSelector();
                        document.getElementById('code-panel').classList.add('active');
                    };
                    reader.readAsText(f);
                });
            });

            document.getElementById('file-selector').onchange = (e) => {
                state.activeFile = e.target.value;
                window.editor.setValue(state.files[state.activeFile]);
            };
        }

        function updateFileSelector() {
            const sel = document.getElementById('file-selector');
            sel.innerHTML = Object.keys(state.files).map(f => `<option value="${f}">${f}</option>`).join('');
        }

        // AI Integration
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if(!text) return;

            appendMessage('user', text);
            input.value = '';
            input.style.height = 'auto';

            const model = state.models.find(m => m.id === state.activeModelId);
            if(!model) return appendMessage('ai', 'No model selected.');

            // Show typing indicator
            const typingId = appendMessage('ai', 'Thinking...');

            try {
                const response = await fetch(model.apiEndpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${model.apiKey}`
                    },
                    body: JSON.stringify({
                        model: model.modelName,
                        messages: [{ role: 'user', content: text }]
                    })
                });

                const data = await response.json();
                const reply = data.choices?.[0]?.message?.content || 'No response generated.';
                
                // Update message
                document.getElementById(typingId).querySelector('.bubble').innerText = reply;

                // Extract code blocks if any
                const codeRegex = /```(?:javascript|js|html|css)?\n([\s\S]*?)\n```/g;
                let match;
                while ((match = codeRegex.exec(reply)) !== null) {
                    const fileName = `generated_${Date.now().toString(36)}.js`;
                    state.files[fileName] = match[1];
                    updateFileSelector();
                    document.getElementById('code-panel').classList.add('active');
                    document.getElementById('file-selector').value = fileName;
                    window.editor.setValue(match[1]);
                }

            } catch (err) {
                document.getElementById(typingId).querySelector('.bubble').innerText = `Error: ${err.message}`;
            }
        }

        function appendMessage(role, text) {
            const container = document.getElementById('messages');
            const id = `msg-${Date.now()}`;
            const provider = state.providers.find(p => p.id === state.models.find(m=>m.id===state.activeModelId)?.providerId);
            
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.id = id;
            div.innerHTML = `
                <div class="avatar">
                    ${role === 'user' ? '<i data-lucide="user" style="width:18px;height:18px"></i>' : `<img src="${provider?.icon || ''}">`}
                </div>
                <div class="bubble">${text}</div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            lucide.createIcons();
            return id;
        }

        // Monaco Editor Setup
        function initMonaco() {
            require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' } });
            require(['vs/editor/editor.main'], function () {
                // Define custom dark theme matching our glass UI
                monaco.editor.defineTheme('qwen-dark', {
                    base: 'vs-dark',
                    inherit: true,
                    rules: [],
                    colors: {
                        'editor.background': '#00000000', // Transparent for glass effect
                        'editor.foreground': '#fafafa',
                        'editor.lineHighlightBackground': '#ffffff05',
                        'editorCursor.foreground': '#6366f1',
                        'editor.selectionBackground': '#6366f133'
                    }
                });

                window.editor = monaco.editor.create(document.getElementById('monaco-container'), {
                    value: state.files[state.activeFile],
                    language: 'javascript',
                    theme: 'qwen-dark',
                    fontFamily: '"JetBrains Mono", monospace',
                    fontSize: 14,
                    minimap: { enabled: false },
                    padding: { top: 16 },
                    automaticLayout: true,
                    scrollBeyondLastLine: false
                });

                window.editor.onDidChangeModelContent(() => {
                    state.files[state.activeFile] = window.editor.getValue();
                });
            });
        }
  </script>
</body>

</html>
